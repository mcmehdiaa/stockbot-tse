[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stockbot-tse"
version = "0.1.0"
description = "Lightweight, approved-user market alerting bot"
requires-python = ">=3.10"
dependencies = [
  "asyncpg>=0.29,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
]

[project.scripts]
stockbot-check-config = "stockbot.main:check_config"
stockbot-worker = "stockbot.worker:main"
stockbot-telegram-worker = "stockbot.telegram_worker:main"
stockbot-bale-worker = "stockbot.bale_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stockbot"]
